[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Memory-aware autonomous research agent — monolithic FastAPI application."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "psycopg[binary]>=3",
    "redis>=6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastapi-redis-sdk>=0.8.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "structlog>=24",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "evaluation"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "httpx2>=0.5",
    "pytest>=8",
]
