<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Research Agent — Build Checklist</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1d2130;
    --border: #2a2f3f;
    --text: #e6e8ee;
    --muted: #9aa2b1;
    --accent: #4f8cff;
    --accent-2: #6ee7a8;
    --danger: #ff6b6b;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 26px; letter-spacing: 0.5px; }
  header p { color: var(--muted); margin-top: 6px; }

  .overall {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 24px;
  }
  .overall .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .overall .pct { font-size: 22px; font-weight: 700; color: var(--accent); }
  .overall .count { color: var(--muted); font-size: 14px; }
  .bar { height: 10px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .bar > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.3s ease;
  }

  .phase {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .phase-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
  }
  .phase-head:hover { background: var(--panel-2); }
  .phase-head .chev {
    width: 10px; height: 10px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(45deg);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .phase.open .phase-head .chev { transform: rotate(-135deg); }
  .phase-title { font-size: 16px; font-weight: 600; flex: 1; }
  .phase-num { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: 1px; }
  .phase-meta { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .phase-body { display: none; padding: 4px 18px 14px; }
  .phase.open .phase-body { display: block; }
  .phase .minibar { height: 5px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin: 10px 18px 0; }
  .phase .minibar > div { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s ease; }
  .phase.done .phase-title { color: var(--accent-2); }
  .phase.done .minibar > div { background: var(--accent-2); }

  ol.steps { list-style: none; counter-reset: step; }
  li.step {
    counter-increment: step;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 6px;
    border-bottom: 1px dashed var(--border);
    cursor: pointer;
    border-radius: 6px;
  }
  li.step:last-child { border-bottom: none; }
  li.step:hover { background: var(--panel-2); }
  li.step::before {
    content: counter(step);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 26px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  li.step.checked::before { background: var(--accent); color: #fff; border-color: var(--accent); }
  li.step .box {
    width: 20px; height: 20px;
    border: 2px solid var(--muted);
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent;
    transition: all 0.15s ease;
  }
  li.step.checked .box { background: var(--accent); border-color: var(--accent); color: #fff; }
  li.step .label { flex: 1; }
  li.step.checked .label { color: var(--muted); text-decoration: line-through; }

  .toolbar { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--panel); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.1); }
  button.danger:hover { background: #3a1f22; border-color: var(--danger); color: var(--danger); }

  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI Research Agent — Build Checklist</h1>
    <p>Click any step to toggle it. Progress is saved in your browser automatically.</p>
  </header>

  <div class="toolbar">
    <button class="primary" onclick="toggleAll('expand')">Expand all</button>
    <button onclick="toggleAll('collapse')">Collapse all</button>
    <button class="danger" onclick="resetAll()">Reset progress</button>
  </div>

  <div class="overall">
    <div class="row">
      <div id="overallPct" class="pct">0%</div>
      <div id="overallCount" class="count">0 / 0 done</div>
    </div>
    <div class="bar"><div id="overallBar"></div></div>
  </div>

  <div id="phases"></div>

  <div class="footer">Single-file checklist — no dependencies, works offline. Data persists via localStorage.</div>
</div>

<script>
  const PHASES = [
    { title: "Foundation", range: [1, 8], steps: [
      [1, "Create GitHub repository."],
      [2, "Create Docker setup."],
      [3, "Create Python/FastAPI backend."],
      [4, "Set up PostgreSQL."],
      [5, "Set up Redis."],
      [6, "Create environment/config management."],
      [7, "Create basic logging."],
      [8, "Create database migrations."],
    ]},
    { title: "LLM", range: [9, 13], steps: [
      [9, "Create <code>LLMProvider</code> interface."],
      [10, "Connect your first LLM provider."],
      [11, "Implement structured LLM responses."],
      [12, "Add token and cost tracking."],
      [13, "Create the <b>LLM Gateway</b>."],
    ]},
    { title: "Agent Service", range: [14, 19], steps: [
      [14, "Create <code>Agent Service</code>."],
      [15, "Create <code>Task</code> model."],
      [16, "Create <code>AgentState</code>."],
      [17, "Create planner."],
      [18, "Create plan/step models."],
      [19, "Implement state machine (CREATED → PLANNING → CONTEXT_BUILDING → EXECUTING → VERIFYING → SYNTHESIS → COMPLETED)."],
    ]},
    { title: "Tool System", range: [20, 27], steps: [
      [20, "Create <code>Tool</code> interface."],
      [21, "Create <code>Tool Gateway</code>."],
      [22, "Implement <code>WebSearch</code>."],
      [23, "Implement <code>WebFetch</code>."],
      [24, "Add tool input/output schemas."],
      [25, "Add tool timeout."],
      [26, "Add tool retry policy."],
      [27, "Add tool permissions."],
    ]},
    { title: "Research Service", range: [28, 38], steps: [
      [28, "Create separate <code>Research Service</code>."],
      [29, "Create research API."],
      [30, "Implement search."],
      [31, "Implement webpage fetching."],
      [32, "Implement HTML extraction."],
      [33, "Implement document/PDF extraction."],
      [34, "Implement chunking."],
      [35, "Implement relevant-passage detection."],
      [36, "Implement fact extraction."],
      [37, "Implement source attribution."],
      [38, "Implement claim verification."],
    ]},
    { title: "Memory Service", range: [39, 51], steps: [
      [39, "Create separate <code>Memory Service</code>."],
      [40, "Create memory database."],
      [41, "Implement structured memory."],
      [42, "Implement semantic memory."],
      [43, "Implement episodic memory."],
      [44, "Implement procedural memory."],
      [45, "Add embeddings."],
      [46, "Add PostgreSQL + pgvector."],
      [47, "Implement <code>MemorySearch</code>."],
      [48, "Implement <code>MemoryWrite</code>."],
      [49, "Implement memory importance."],
      [50, "Implement memory confidence."],
      [51, "Implement memory recency."],
    ]},
    { title: "Context Engineering", range: [52, 61], steps: [
      [52, "Create <code>Context Compiler</code>."],
      [53, "Retrieve candidate memories."],
      [54, "Apply metadata filters."],
      [55, "Calculate relevance."],
      [56, "Calculate importance."],
      [57, "Calculate recency."],
      [58, "Detect conflicting memories."],
      [59, "Remove redundant memories."],
      [60, "Apply token/context budget."],
      [61, "Send final context to the Agent."],
    ]},
    { title: "Distributed Messaging", range: [62, 70], steps: [
      [62, "Create message/event schemas."],
      [63, "Set up Redis queues."],
      [64, "Create <code>TaskCreated</code> event."],
      [65, "Create <code>ResearchRequested</code> event."],
      [66, "Create <code>ResearchCompleted</code> event."],
      [67, "Create <code>MemoryRetrieved</code> event."],
      [68, "Create <code>ToolCalled</code> event."],
      [69, "Create <code>ToolFailed</code> event."],
      [70, "Create <code>TaskCompleted</code> event."],
    ]},
    { title: "Reliability", range: [71, 79], steps: [
      [71, "Add timeouts."],
      [72, "Add exponential backoff."],
      [73, "Add bounded retries."],
      [74, "Add checkpointing."],
      [75, "Add task recovery."],
      [76, "Add idempotency."],
      [77, "Add circuit breakers."],
      [78, "Add dead-letter handling."],
      [79, "Add fallback models/tools."],
    ]},
    { title: "Security", range: [80, 86], steps: [
      [80, "Implement authentication."],
      [81, "Implement authorization."],
      [82, "Create permission system (READ_MEMORY, WRITE_MEMORY, WEB_SEARCH, DOCUMENT_ACCESS, EXTERNAL_ACTION)."],
      [83, "Isolate users' data."],
      [84, "Add private-context gateway."],
      [85, "Prevent unnecessary personal information from reaching external tools."],
      [86, "Add audit logging."],
    ]},
    { title: "Observability", range: [87, 97], steps: [
      [87, "Add OpenTelemetry."],
      [88, "Add distributed <code>trace_id</code>."],
      [89, "Track <code>task_id</code>."],
      [90, "Track service latency."],
      [91, "Track tool calls."],
      [92, "Track LLM calls."],
      [93, "Track token usage."],
      [94, "Track cost."],
      [95, "Track errors."],
      [96, "Track retries."],
      [97, "Build execution trace UI/API."],
    ]},
    { title: "Career Service", range: [98, 108], steps: [
      [98, "Create separate <code>Career Service</code>."],
      [99, "Implement job search."],
      [100, "Implement job requirement extraction."],
      [101, "Implement skill normalization."],
      [102, "Implement job matching."],
      [103, "Implement company comparison."],
      [104, "Implement resume parser."],
      [105, "Implement resume analysis."],
      [106, "Implement resume tailoring."],
      [107, "Implement skill-gap analysis."],
      [108, "Implement personalized recommendations."],
    ]},
    { title: "Evaluation", range: [109, 120], steps: [
      [109, "Create research evaluation dataset."],
      [110, "Create memory evaluation dataset."],
      [111, "Create tool evaluation dataset."],
      [112, "Create career evaluation dataset."],
      [113, "Create failure scenarios."],
      [114, "Measure task completion."],
      [115, "Measure citation accuracy."],
      [116, "Measure memory precision/recall."],
      [117, "Measure hallucination rate."],
      [118, "Measure recovery success."],
      [119, "Measure latency."],
      [120, "Measure cost."],
    ]},
    { title: "Frontend", range: [121, 130], steps: [
      [121, "Build Next.js/React frontend."],
      [122, "Create login."],
      [123, "Create chat/task interface."],
      [124, "Create task status page."],
      [125, "Show agent progress."],
      [126, "Show research sources."],
      [127, "Show citations."],
      [128, "Show memory used."],
      [129, "Show execution trace."],
      [130, "Show final career recommendations."],
    ]},
    { title: "Containerization", range: [131, 138], steps: [
      [131, "Dockerize API Gateway."],
      [132, "Dockerize Agent Service."],
      [133, "Dockerize Memory Service."],
      [134, "Dockerize Research Service."],
      [135, "Dockerize Career Service."],
      [136, "Dockerize LLM Gateway."],
      [137, "Dockerize Tool Gateway."],
      [138, "Create Docker Compose development environment."],
    ]},
    { title: "Kubernetes", range: [139, 153], steps: [
      [139, "Create Kubernetes namespaces."],
      [140, "Create deployments."],
      [141, "Create services."],
      [142, "Create ConfigMaps."],
      [143, "Create Secrets."],
      [144, "Add health checks."],
      [145, "Add readiness/liveness probes."],
      [146, "Add horizontal scaling."],
      [147, "Deploy Agent workers."],
      [148, "Deploy Research workers."],
      [149, "Deploy Memory service."],
      [150, "Deploy Career service."],
      [151, "Configure Redis."],
      [152, "Configure PostgreSQL."],
      [153, "Configure observability."],
    ]},
  ];

  const KEY = "ai-research-agent-checklist-v1";
  const state = load();

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { return {}; }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  function render() {
    const host = document.getElementById("phases");
    host.innerHTML = "";
    let totalDone = 0, totalSteps = 0;

    PHASES.forEach((phase, i) => {
      const section = document.createElement("section");
      section.className = "phase";
      section.dataset.i = i;

      const head = document.createElement("div");
      head.className = "phase-head";
      head.addEventListener("click", () => {
        section.classList.toggle("open");
        save();
      });

      const chev = document.createElement("div"); chev.className = "chev";
      const num = document.createElement("span"); num.className = "phase-num";
      num.textContent = "PHASE " + (i + 1) + " · STEPS " + phase.range[0] + "–" + phase.range[1];
      const title = document.createElement("span"); title.className = "phase-title";
      title.textContent = phase.title;

      const meta = document.createElement("span"); meta.className = "phase-meta";
      const phaseDone = phase.steps.filter(([n]) => state[n]).length;
      meta.id = "meta-" + i;
      meta.textContent = phaseDone + " / " + phase.steps.length;

      head.append(chev, num, title, meta);

      const minibar = document.createElement("div"); minibar.className = "minibar";
      const minibarFill = document.createElement("div"); minibarFill.id = "mini-" + i;
      minibar.append(minibarFill);

      const body = document.createElement("div"); body.className = "phase-body";
      const ol = document.createElement("ol"); ol.className = "steps";
      phase.steps.forEach(([n, label]) => {
        const li = document.createElement("li");
        li.className = "step";
        if (state[n]) li.classList.add("checked");
        li.dataset.n = n;
        li.addEventListener("click", () => toggle(n, li));
        const box = document.createElement("div"); box.className = "box"; box.textContent = "✓";
        const lbl = document.createElement("div"); lbl.className = "label";
        lbl.innerHTML = label;
        li.append(box, lbl);
        ol.append(li);
      });
      body.append(ol);
      section.append(head, minibar, body);
      host.append(section);

      totalSteps += phase.steps.length;
      const done = phaseDone;
      totalDone += done;
      minibarFill.style.width = percent(done, phase.steps.length);
      if (done === phase.steps.length) section.classList.add("done");
      meta.textContent = done + " / " + phase.steps.length;
    });

    const pct = percent(totalDone, totalSteps);
    document.getElementById("overallBar").style.width = pct;
    document.getElementById("overallPct").textContent = pct;
    document.getElementById("overallCount").textContent = totalDone + " / " + totalSteps + " done";
  }

  function toggle(n, li) {
    state[n] = !state[n];
    li.classList.toggle("checked", state[n]);
    save();
    updateCounts();
  }

  function percent(done, total) {
    return total === 0 ? "0%" : Math.round((done / total) * 100) + "%";
  }

  function updateCounts() {
    let totalDone = 0, totalSteps = 0;
    PHASES.forEach((phase, i) => {
      const done = phase.steps.filter(([n]) => state[n]).length;
      totalDone += done; totalSteps += phase.steps.length;
      document.getElementById("mini-" + i).style.width = percent(done, phase.steps.length);
      document.getElementById("meta-" + i).textContent = done + " / " + phase.steps.length;
      const section = document.querySelector(`.phase[data-i="${i}"]`);
      section.classList.toggle("done", done === phase.steps.length);
    });
    const pct = percent(totalDone, totalSteps);
    document.getElementById("overallBar").style.width = pct;
    document.getElementById("overallPct").textContent = pct;
    document.getElementById("overallCount").textContent = totalDone + " / " + totalSteps + " done";
  }

  function toggleAll(mode) {
    document.querySelectorAll(".phase").forEach(s => s.classList.toggle("open", mode === "expand"));
    save();
  }

  function resetAll() {
    if (!confirm("Reset ALL progress? This cannot be undone.")) return;
    for (const key of Object.keys(state)) delete state[key];
    save();
    render();
  }

  render();
</script>
</body>
</html>
