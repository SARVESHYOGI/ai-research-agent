[project]
name = "memory-service"
version = "0.1.0"
description = "Structured, semantic, episodic and procedural memory backed by PostgreSQL + pgvector."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=6",
    "pydantic-settings>=2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[tool.uv]
package = false