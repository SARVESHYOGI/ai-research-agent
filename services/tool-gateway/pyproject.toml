[project]
name = "tool-gateway"
version = "0.1.0"
description = "Controlled execution of external tools with schemas, permissions, timeout and retry policy."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=6",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "tenacity>=9",
]

[tool.uv]
package = false