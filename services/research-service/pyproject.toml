[project]
name = "research-service"
version = "0.1.0"
description = "Search, fetch, extraction, chunking, fact extraction and verification pipeline."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastapi-redis-sdk>=0.8.0",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=5",
    "tenacity>=9",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "httpx2>=0.5",
    "pytest>=8",
]

[tool.uv]
package = false